server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  api:
    description: Бронирования, пользователи и выдача JWT
  seed:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-it-must-be-32-bytes-or-longer}
    issuer: hotel-booking
    access-token-ttl: 1h

booking:
  hotel-client:
    base-url: http://hotel-service
    connect-timeout: 1s
    read-timeout: 3s
    max-candidates: 5
  saga-recovery:
    enabled: true
    interval: 30s
    pending-timeout: 5m
    batch-size: 50

resilience4j:
  retry:
    instances:
      hotel:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - ru.hotelbooking.booking.client.HotelServiceUnavailableException
  circuitbreaker:
    instances:
      hotel:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - ru.hotelbooking.booking.client.HotelServiceUnavailableException
        register-health-indicator: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    operations-sorter: method

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  file:
    name: logs/booking-service.log
  structured:
    format:
      file: ecs
  level:
    ru.hotelbooking: INFO
